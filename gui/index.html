<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Perceptual unit</title>
  </head>
  <body>
    <div>
      <input id="token" type="text" autocomplete="off" placeholder="text">
      <button id="send">Send</button>
      <button id="reset">Reset</button>
    </div>
    <div>moment <span id="moment"></span></div>
    <table>
      <tr id="titles"></tr>
      <tr id="canvases"></tr>
    </table>
    <script>
      const field = document.getElementById("token");
      const button = document.getElementById("send");
      const resetButton = document.getElementById("reset");
      const momentLabel = document.getElementById("moment");
      const titles = document.getElementById("titles");
      const canvases = document.getElementById("canvases");
      const views = {};

      function viewOf(uid) {
        if (!views[uid]) {
          const title = document.createElement("td");
          const cell = document.createElement("td");
          const canvas = document.createElement("canvas");
          canvas.width = 400;
          canvas.height = 400;
          cell.appendChild(canvas);
          titles.appendChild(title);
          canvases.appendChild(cell);
          views[uid] = {title: title, canvas: canvas};
        }
        return views[uid];
      }

      function titleOf(plane) {
        return plane.relax ? plane.uid + " " + plane.relax : plane.uid;
      }

      function drawFrame(context, canvas) {
        context.strokeStyle = "black";
        context.lineWidth = 1;
        context.strokeRect(0.5, 0.5, canvas.width - 1, canvas.height - 1);
      }

      function drawPerception(context, canvas, plane, perception) {
        const radius = perception.energy * canvas.width;
        const hue = (perception.moment * 67) % 360;
        context.beginPath();
        context.arc(perception.x * canvas.width, perception.y * canvas.height, Math.max(radius, 0.5), 0, 2 * Math.PI);
        context.fillStyle = "hsla(" + hue + ", 70%, 60%, " + (perception.read ? 0.12 : 0.35) + ")";
        context.fill();
        context.strokeStyle = "hsla(" + hue + ", 70%, 40%, 0.8)";
        context.lineWidth = 1;
        context.stroke();
        const locked = perception.locked || [];
        locked.forEach(function (index, position) {
          const angle = index * 2.399963;
          context.fillStyle = cursorColor(index);
          context.beginPath();
          context.arc(perception.x * canvas.width + Math.cos(angle) * Math.max(radius, 4), perception.y * canvas.height + Math.sin(angle) * Math.max(radius, 4), 2.5, 0, 2 * Math.PI);
          context.fill();
        });
        if (perception.word) {
          context.fillStyle = "black";
          context.fillText(perception.word, perception.x * canvas.width + 4, perception.y * canvas.height);
        }
      }

      function cursorColor(index) {
        return "hsl(" + (index * 137.5) % 360 + ", 85%, 38%)";
      }

      function drawCursor(context, canvas, cursor, index) {
        context.strokeStyle = cursorColor(index);
        context.lineWidth = 1;
        if (cursor.segment) {
          context.beginPath();
          context.moveTo(cursor.segment[0] * canvas.width, cursor.segment[1] * canvas.height);
          context.lineTo(cursor.segment[2] * canvas.width, cursor.segment[3] * canvas.height);
          context.stroke();
        }
        context.fillStyle = cursorColor(index);
        context.beginPath();
        context.arc(cursor.x * canvas.width, cursor.y * canvas.height, 3, 0, 2 * Math.PI);
        context.fill();
      }

      function drawPlane(canvas, plane, cursors) {
        const context = canvas.getContext("2d");
        context.clearRect(0, 0, canvas.width, canvas.height);
        drawFrame(context, canvas);
        plane.perceptions.forEach(function (perception) {
          drawPerception(context, canvas, plane, perception);
        });
        cursors.forEach(function (cursor, index) {
          if (cursor.source === plane.uid) {
            drawCursor(context, canvas, cursor, index);
          }
        });
      }

      function draw(state) {
        momentLabel.textContent = state.moment;
        state.planes.forEach(function (plane) {
          const view = viewOf(plane.uid);
          view.title.textContent = titleOf(plane);
          drawPlane(view.canvas, plane, state.cursors);
        });
      }

      async function refresh() {
        const response = await fetch("/api/state");
        draw(await response.json());
      }

      async function send() {
        const response = await fetch("/api/text", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({text: field.value})
        });
        if (response.ok) {
          field.value = "";
          draw(await response.json());
        }
      }

      async function reset() {
        const response = await fetch("/api/reset", {method: "POST"});
        if (response.ok) {
          draw(await response.json());
        }
      }

      button.addEventListener("click", send);
      resetButton.addEventListener("click", reset);
      field.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          send();
        }
      });

      refresh();
      setInterval(refresh, 100);
    </script>
  </body>
</html>
