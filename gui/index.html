<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Perceptual unit</title>
  </head>
  <body>
    <div>
      <input id="token" type="text" autocomplete="off" placeholder="text">
      <button id="send">Send</button>
    </div>
    <div>moment <span id="moment"></span></div>
    <table>
      <tr>
        <td id="title-a"></td>
        <td id="title-c"></td>
      </tr>
      <tr>
        <td><canvas id="plane-a" width="400" height="400"></canvas></td>
        <td><canvas id="plane-c" width="400" height="400"></canvas></td>
      </tr>
    </table>
    <script>
      const field = document.getElementById("token");
      const button = document.getElementById("send");
      const momentLabel = document.getElementById("moment");
      const canvasA = document.getElementById("plane-a");
      const canvasC = document.getElementById("plane-c");
      const titleA = document.getElementById("title-a");
      const titleC = document.getElementById("title-c");

      function planeOf(state, uid) {
        return state.planes.find(function (plane) {
          return plane.uid === uid;
        });
      }

      function titleOf(plane) {
        return plane.relax ? plane.uid + " " + plane.relax : plane.uid;
      }

      function drawFrame(context, canvas) {
        context.strokeStyle = "black";
        context.lineWidth = 1;
        context.strokeRect(0.5, 0.5, canvas.width - 1, canvas.height - 1);
      }

      function drawPerception(context, canvas, plane, perception) {
        const radius = Math.max(1, perception.energy / plane.peak * canvas.width * 0.05);
        context.beginPath();
        context.arc(perception.x * canvas.width, perception.y * canvas.height, radius, 0, 2 * Math.PI);
        context.fillStyle = "hsla(" + (perception.moment * 67) % 360 + ", 70%, 60%, " + (perception.read ? 0.12 : 0.35) + ")";
        context.fill();
        if (perception.word) {
          context.fillStyle = "black";
          context.fillText(perception.word, perception.x * canvas.width + radius + 2, perception.y * canvas.height);
        }
      }

      function drawCursor(context, canvas, cursor) {
        context.strokeStyle = "navy";
        context.lineWidth = 1;
        if (cursor.segment) {
          context.beginPath();
          context.moveTo(cursor.segment[0] * canvas.width, cursor.segment[1] * canvas.height);
          context.lineTo(cursor.segment[2] * canvas.width, cursor.segment[3] * canvas.height);
          context.stroke();
        }
        context.fillStyle = "navy";
        context.beginPath();
        context.arc(cursor.x * canvas.width, cursor.y * canvas.height, 3, 0, 2 * Math.PI);
        context.fill();
      }

      function drawPlane(canvas, plane, cursors) {
        const context = canvas.getContext("2d");
        context.clearRect(0, 0, canvas.width, canvas.height);
        drawFrame(context, canvas);
        plane.perceptions.forEach(function (perception) {
          drawPerception(context, canvas, plane, perception);
        });
        cursors.filter(function (cursor) {
          return cursor.source === plane.uid;
        }).forEach(function (cursor) {
          drawCursor(context, canvas, cursor);
        });
      }

      function draw(state) {
        momentLabel.textContent = state.moment;
        const planeA = planeOf(state, "A");
        const planeC = planeOf(state, "C");
        titleA.textContent = titleOf(planeA);
        titleC.textContent = titleOf(planeC);
        drawPlane(canvasA, planeA, state.cursors);
        drawPlane(canvasC, planeC, state.cursors);
      }

      async function refresh() {
        const response = await fetch("/api/state");
        draw(await response.json());
      }

      async function send() {
        const response = await fetch("/api/text", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({text: field.value})
        });
        if (response.ok) {
          field.value = "";
          draw(await response.json());
        }
      }

      button.addEventListener("click", send);
      field.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          send();
        }
      });

      refresh();
      setInterval(refresh, 100);
    </script>
  </body>
</html>
